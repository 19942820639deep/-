name: A-share tail snapshot

on:
  push:
    branches: [main]
    paths:
      - collector.py
      - test_collector.py
      - .github/workflows/a-share-snapshot.yml
  schedule:
    # 14:30, 14:35, 14:40 and 14:45 Asia/Shanghai (UTC+8).
    - cron: "30,35,40,45 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a-share-tail-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Probe Tencent quote schema
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          url = "https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getBoardRankList?" + urlencode({
              "_appver": "11.17.0", "board_code": "aStock", "sort_type": "price",
              "direct": "down", "offset": "0", "count": "2"
          })
          req = Request(url, headers={"User-Agent": "Mozilla/5.0", "Referer": "https://stockapp.finance.qq.com/"})
          with urlopen(req, timeout=20) as response:
              payload = json.loads(response.read().decode("utf-8"))
          rows = payload["data"]["rank_list"]
          print(json.dumps({"total": payload["data"]["total"], "sample": rows[:2]}, ensure_ascii=False))
          for quote_url, referer, encoding in [
              ("https://qt.gtimg.cn/q=sh688808,sz300308", "https://gu.qq.com/", "gbk"),
              ("https://hq.sinajs.cn/list=sh688808,sz300308", "https://finance.sina.com.cn/", "gbk"),
          ]:
              qreq = Request(quote_url, headers={"User-Agent": "Mozilla/5.0", "Referer": referer})
              try:
                  with urlopen(qreq, timeout=20) as response:
                      print("QUOTE_PROBE", quote_url, response.read().decode(encoding, errors="ignore")[:3000])
              except Exception as exc:
                  print("QUOTE_PROBE_ERROR", quote_url, type(exc).__name__, str(exc))
          PY
      - name: Collect and validate
        run: python collector.py
      - name: Run logic tests
        run: python -m unittest -v test_collector.py
      - name: Publish latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh A-share tail snapshot"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
