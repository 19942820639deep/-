name: A-share tail snapshot

on:
  push:
    branches: [main]
    paths:
      - collector.py
      - test_collector.py
      - .github/workflows/a-share-snapshot.yml
      # Emergency on-demand trigger: update only this marker file via an approved GitHub write.
      - data/refresh-request.txt
  # Re-registered 2026-10-28 after a missed A-share morning schedule window.
  # GitHub schedule has no execution-time SLA; use workflow_dispatch or the
  # data/refresh-request.txt push trigger whenever the snapshot is stale.
  schedule:
    # UTC = Beijing time - 8 hours. Five-minute cadence in active A-share windows.
    # GitHub Actions can queue late; the collector still BLOCKS any snapshot >300s.
    # 09:34-09:59 Beijing
    - cron: "34,39,44,49,54,59 1 * * 1-5"
    # 10:04-10:59 Beijing
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 2 * * 1-5"
    # 11:04-11:44 Beijing; special 11:30 exact, 11:35/11:40 catch-ups
    - cron: "4,9,14,19,24,29,34,39,44 3 * * 1-5"
    - cron: "30,35,40 3 * * 1-5"
    # 12:04-12:14 Beijing; midday-close backup
    - cron: "4,9,14 4 * * 1-5"
    # 13:04-13:59 Beijing
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 5 * * 1-5"
    # 14:04-14:59 Beijing
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 6 * * 1-5"
    # 15:04-15:14 Beijing; close for next-day plan
    - cron: "4,9,14 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a-share-tail-snapshot
  # Do not let a newly released delayed cron cancel a collector that is already
  # close to publishing. One pending run is enough to catch up afterwards.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and validate
        id: collect
        continue-on-error: true
        env:
          # Configure in Settings > Secrets and variables > Actions.
          # GitHub masks the value; collector.py never serializes it.
          THS_API_KEY: ${{ secrets.THS_API_KEY }}
        run: python collector.py
      - name: Run logic tests
        id: tests
        continue-on-error: true
        run: python -m unittest -v test_collector.py
      - name: Publish snapshot and run status
        id: publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/latest.json /tmp/a-share-latest.json
          cp data/status.json /tmp/a-share-status.json
          if [ -f data/midday_latest.json ]; then cp data/midday_latest.json /tmp/a-share-midday.json; fi
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/a-share-latest.json data/latest.json
            cp /tmp/a-share-status.json data/status.json
            if [ -f /tmp/a-share-midday.json ]; then cp /tmp/a-share-midday.json data/midday_latest.json; fi
            git add data/latest.json data/status.json
            if [ -f data/midday_latest.json ]; then git add data/midday_latest.json; fi
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data: refresh A-share snapshot status"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
      - name: Preserve failure conclusion
        if: always() && (steps.collect.outcome != 'success' || steps.tests.outcome != 'success' || steps.publish.outcome != 'success')
        run: exit 1
