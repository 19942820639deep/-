name: A-share tail snapshot

on:
  push:
    branches: [main]
    paths:
      - collector.py
      - test_collector.py
      - .github/workflows/a-share-snapshot.yml
  schedule:
    # All cron entries are UTC; comments show Asia/Shanghai.
    # 10:20, 10:25, 10:30.
    - cron: "20,25,30 2 * * 1-5"
    # 11:25, 11:30, 11:35 (morning close snapshot).
    - cron: "25,30,35 3 * * 1-5"
    # 14:20 through 14:45 every five minutes.
    - cron: "20,25,30,35,40,45 6 * * 1-5"
    # 15:00 and 15:05 (final close snapshot for the next premarket plan).
    - cron: "0,5 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a-share-tail-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and validate
        run: python collector.py
      - name: Run logic tests
        run: python -m unittest -v test_collector.py
      - name: Publish latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/latest.json /tmp/a-share-latest.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/a-share-latest.json data/latest.json
            git add data/latest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data: refresh A-share tail snapshot"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
