name: A-share tail snapshot

on:
  push:
    branches: [main]
    paths:
      - collector.py
      - test_collector.py
      - .github/workflows/a-share-snapshot.yml
      # Emergency on-demand trigger: update only this marker file via an approved GitHub write.
      - data/refresh-request.txt
  # Re-registered 2026-10-28 after a missed A-share morning schedule window.
  # GitHub schedule has no execution-time SLA; use workflow_dispatch or the
  # data/refresh-request.txt push trigger whenever the snapshot is stale.
  schedule:
    # All cron entries are UTC; comments show Asia/Shanghai.
    # Avoid minute 00/05/10 etc. GitHub documents heavier schedule delay near
    # common clock boundaries; odd offsets materially reduce queue contention.
    # 09:34 through 09:54 every five minutes: prime 09:45 PRE and NEW decisions.
    - cron: "34,39,44,49,54 1 * * 1-5"
    # 10:14 through 10:34 every five minutes.
    - cron: "14,19,24,29,34 2 * * 1-5"
    # 11:34 through 11:59: capture the 11:30 close before noon validation.
    - cron: "34,39,44,49,54,59 3 * * 1-5"
    # 12:04 through 12:14 backup runs; lunch-close validation accepts delay.
    - cron: "4,9,14 4 * * 1-5"
    # 14:14 through 14:54 every five minutes; odd-minute retries reduce missed tail snapshots.
    - cron: "14,19,24,29,34,39,44,49,54 6 * * 1-5"
    # 15:04 through 15:14 (final close snapshot for the next premarket plan).
    - cron: "4,9,14 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a-share-tail-snapshot
  # Do not let a newly released delayed cron cancel a collector that is already
  # close to publishing. One pending run is enough to catch up afterwards.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and validate
        id: collect
        continue-on-error: true
        env:
          # Configure in Settings > Secrets and variables > Actions.
          # GitHub masks the value; collector.py never serializes it.
          THS_API_KEY: ${{ secrets.THS_API_KEY }}
        run: python collector.py
      - name: Run logic tests
        id: tests
        continue-on-error: true
        run: python -m unittest -v test_collector.py
      - name: Publish snapshot and run status
        id: publish
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/latest.json /tmp/a-share-latest.json
          cp data/status.json /tmp/a-share-status.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/a-share-latest.json data/latest.json
            cp /tmp/a-share-status.json data/status.json
            git add data/latest.json data/status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data: refresh A-share snapshot status"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
      - name: Preserve failure conclusion
        if: always() && (steps.collect.outcome != 'success' || steps.tests.outcome != 'success' || steps.publish.outcome != 'success')
        run: exit 1
